$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [schema_version, id, category, description, requirements, variants, runtime, checks]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: '^[a-z][a-z0-9_.-]+$'}
  category: {enum: [software, network, web]}
  description: {type: string, minLength: 1}
  requirements:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [source, section, description]
      properties:
        source: {type: string, minLength: 1}
        section: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
  variants:
    type: object
    minProperties: 1
    propertyNames: {pattern: '^[a-z0-9][a-z0-9_-]*$'}
    additionalProperties:
      type: object
      additionalProperties: false
      required: [setup, architecture]
      properties:
        setup: {type: string, minLength: 1}
        architecture: {enum: [amd64, arm64]}
  dependencies:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  prepare:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, argv, expected]
      properties:
        id: {type: string, pattern: '^[a-z0-9_.-]+$'}
        argv: {$ref: '#/$defs/argv'}
        cwd: {type: string}
        timeout: {$ref: '#/$defs/timeout'}
        expected: {type: array, items: {type: string}, minItems: 1}
  build:
    type: object
    additionalProperties: false
    properties:
      timeout: {$ref: '#/$defs/timeout'}
  runtime:
    type: object
    additionalProperties: false
    required: [backend, compose, services, readiness]
    properties:
      backend: {const: compose}
      compose: {type: string, minLength: 1}
      services:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          additionalProperties: false
          required: [role]
          properties:
            role: {enum: [daemon, oneshot, build-only]}
      readiness:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/check'}
  checks:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/check'}
$defs:
  argv:
    type: array
    minItems: 1
    items: {type: string}
  timeout: {type: number, exclusiveMinimum: 0, maximum: 7200}
  check:
    type: object
    additionalProperties: false
    required: [id, type, requirement]
    properties:
      id: {type: string, pattern: '^[a-z0-9_.-]+$'}
      type: {enum: [exec, http, file, service-state, container-ip]}
      requirement: {type: string}
      required: {type: boolean}
      timeout: {$ref: '#/$defs/timeout'}
      retries: {type: integer, minimum: 1, maximum: 120}
      interval: {type: number, minimum: 0, maximum: 60}
      service: {type: string, minLength: 1}
      argv: {$ref: '#/$defs/argv'}
      expect_exit: {type: integer}
      stdout_contains: {type: string}
      url: {type: string, pattern: '^http://'}
      connect_address: {type: string, minLength: 1}
      headers: {type: object, additionalProperties: {type: string}}
      expect_status: {type: integer, minimum: 100, maximum: 599}
      body_contains: {type: string}
      expected_headers: {type: object, additionalProperties: {type: string}}
      path: {type: string, pattern: '^/'}
      source: {type: string, minLength: 1}
      executable: {type: boolean}
      expected: {type: string, minLength: 1}
    allOf:
      - if: {properties: {type: {const: exec}}}
        then: {required: [service, argv]}
      - if: {properties: {type: {const: http}}}
        then: {required: [url, expect_status]}
      - if: {properties: {type: {const: file}}}
        then: {required: [service, path, source]}
      - if: {properties: {type: {enum: [service-state, container-ip]}}}
        then: {required: [service, expected]}
      - if: {properties: {type: {const: service-state}}}
        then: {properties: {expected: {enum: [running, exited-0]}}}
