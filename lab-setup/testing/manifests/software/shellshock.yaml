schema_version: 1
id: software.shellshock
category: software
description: Verify Shellshock lab prerequisites and normal CGI operation without exploiting the vulnerability.

requirements:
  web-server:
    source: category-software/Shellshock/Shellshock.tex
    section: Environment Setup / Container Setup and Commands
    description: The provided victim web server must start and serve requests.
  addressing:
    source: category-software/Shellshock/Shellshock.tex
    section: Environment Setup / DNS Setting
    description: www.seed-server.com addresses the victim at 10.9.0.5.
  cgi:
    source: category-software/Shellshock/Shellshock.tex
    section: Environment Setup / Web Server and CGI
    description: Executable CGI scripts use the provided old Bash interpreter and vul.cgi prints Hello World.
  environment-cgi:
    source: category-software/Shellshock/Shellshock.tex
    section: Task 2 / Passing Data to Bash via Environment Variable
    description: The provided getenv.cgi exposes normal HTTP request environment variables.

variants:
  amd64:
    setup: category-software/Shellshock/Labsetup
    architecture: amd64
  arm64:
    setup: category-software/Shellshock/Labsetup-arm
    architecture: arm64

build:
  timeout: 1200

runtime:
  backend: compose
  compose: docker-compose.yml
  services:
    victim:
      role: daemon
  readiness:
    - id: victim-running
      requirement: web-server
      type: service-state
      service: victim
      expected: running
      retries: 10
      interval: 2
    - id: apache-ready
      requirement: web-server
      type: http
      url: http://www.seed-server.com/cgi-bin/vul.cgi
      connect_address: 10.9.0.5
      expect_status: 200
      body_contains: Hello World
      timeout: 5
      retries: 20
      interval: 2

checks:
  - id: victim-ip
    requirement: addressing
    type: container-ip
    service: victim
    expected: 10.9.0.5
  - id: bash-identity
    requirement: cgi
    type: file
    service: victim
    path: /bin/bash_shellshock
    source: image_www/bash_shellshock
    executable: true
  - id: bash-runs-natively
    requirement: cgi
    type: exec
    service: victim
    argv: [/bin/bash_shellshock, --version]
    stdout_contains: GNU bash, version 4.
  - id: hello-cgi-identity
    requirement: cgi
    type: file
    service: victim
    path: /usr/lib/cgi-bin/vul.cgi
    source: image_www/vul.cgi
    executable: true
  - id: environment-cgi-identity
    requirement: environment-cgi
    type: file
    service: victim
    path: /usr/lib/cgi-bin/getenv.cgi
    source: image_www/getenv.cgi
    executable: true
  - id: normal-cgi-request
    requirement: cgi
    type: http
    url: http://www.seed-server.com/cgi-bin/vul.cgi
    connect_address: 10.9.0.5
    expect_status: 200
    expected_headers:
      Content-Type: text/plain
    body_contains: Hello World
  - id: normal-header-environment
    requirement: environment-cgi
    type: http
    url: http://www.seed-server.com/cgi-bin/getenv.cgi
    connect_address: 10.9.0.5
    headers:
      User-Agent: SEED-Lab-Environment-Check
    expect_status: 200
    body_contains: HTTP_USER_AGENT=SEED-Lab-Environment-Check
  - id: http-host-environment
    requirement: addressing
    type: http
    url: http://www.seed-server.com/cgi-bin/getenv.cgi
    connect_address: 10.9.0.5
    expect_status: 200
    body_contains: HTTP_HOST=www.seed-server.com
