id: network.tcp_attacks
category: network
description: Initial environment acceptance for TCP_Attacks; no attacks or student
  solutions.
requirements:
  topology:
    source: category-network/TCP_Attacks/TCP_Attacks.tex
    section: Lab environment / initial topology
    description: Initial hosts, addresses, interfaces and routes match the supplied
      lab topology.
  services:
    source: category-network/TCP_Attacks/TCP_Attacks.tex
    section: Lab environment / initial services
    description: Provided services start and accept ordinary traffic before students
      modify the environment.
  capabilities:
    source: category-network/TCP_Attacks/TCP_Attacks.tex
    section: Lab environment / required tools
    description: Packet capture, protocol libraries and required kernel interfaces
      are usable.
  configuration:
    source: category-network/TCP_Attacks/TCP_Attacks.tex
    section: Lab environment / initial configuration
    description: Initial countermeasure and firewall settings preserve the conditions
      described by the manual.
variants:
  amd64:
    setup: category-network/TCP_Attacks/Labsetup
    architecture: amd64
  arm64:
    setup: category-network/TCP_Attacks/Labsetup-arm
    architecture: arm64
runtime:
  backend: compose
  compose: docker-compose.yml
  services:
    attacker:
      role: daemon
    Victim:
      role: daemon
    User1:
      role: daemon
    User2:
      role: daemon
  readiness:
  - id: attacker-running
    type: service-state
    requirement: services
    service: attacker
    expected: running
    retries: 20
    interval: 2
  - id: victim-running
    type: service-state
    requirement: services
    service: Victim
    expected: running
    retries: 20
    interval: 2
  - id: user1-running
    type: service-state
    requirement: services
    service: User1
    expected: running
    retries: 20
    interval: 2
  - id: user2-running
    type: service-state
    requirement: services
    service: User2
    expected: running
    retries: 20
    interval: 2
  - id: victim-telnet
    type: tcp
    requirement: services
    host: 10.9.0.5
    port: 23
    retries: 20
    interval: 2
    timeout: 3
  - id: user1-telnet
    type: tcp
    requirement: services
    host: 10.9.0.6
    port: 23
    retries: 20
    interval: 2
    timeout: 3
  - id: user2-telnet
    type: tcp
    requirement: services
    host: 10.9.0.7
    port: 23
    retries: 20
    interval: 2
    timeout: 3
checks:
- id: victim-ip-0
  type: container-ip
  requirement: topology
  service: Victim
  expected: 10.9.0.5
- id: user1-ip-0
  type: container-ip
  requirement: topology
  service: User1
  expected: 10.9.0.6
- id: user2-ip-0
  type: container-ip
  requirement: topology
  service: User2
  expected: 10.9.0.7
- id: attacker-host-network
  type: container-network-mode
  requirement: capabilities
  service: attacker
  expected: host
- id: victim-syncookies
  type: exec
  requirement: configuration
  service: Victim
  argv:
  - sysctl
  - -n
  - net.ipv4.tcp_syncookies
  stdout_equals: '0'
- id: user-reaches-victim
  type: exec
  requirement: topology
  service: User1
  argv:
  - ping
  - -c
  - '2'
  - -W
  - '2'
  - 10.9.0.5
- id: attacker-capture-normal-icmp
  type: exec
  requirement: capabilities
  service: attacker
  argv:
  - python3
  - -c
  - from scapy.all import AsyncSniffer,conf; import subprocess,time; s=AsyncSniffer(iface=conf.route.route('10.9.0.5')[0],filter='icmp',count=1,store=True);
    s.start(); time.sleep(.5); subprocess.run(['ping','-c','1','-W','2','10.9.0.5'],check=True,timeout=4);
    s.join(4); assert s.results and len(s.results)>0
  timeout: 15
