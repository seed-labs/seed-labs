id: network.dns_remote
category: network
description: Initial environment acceptance for DNS_Remote; no attacks or student
  solutions.
requirements:
  topology:
    source: category-network/DNS_Remote/DNS_Remote.tex
    section: Lab environment / initial topology
    description: Initial hosts, addresses, interfaces and routes match the supplied
      lab topology.
  services:
    source: category-network/DNS_Remote/DNS_Remote.tex
    section: Lab environment / initial services
    description: Provided services start and accept ordinary traffic before students
      modify the environment.
  capabilities:
    source: category-network/DNS_Remote/DNS_Remote.tex
    section: Lab environment / required tools
    description: Packet capture, protocol libraries and required kernel interfaces
      are usable.
  configuration:
    source: category-network/DNS_Remote/DNS_Remote.tex
    section: Lab environment / initial configuration
    description: Initial countermeasure and firewall settings preserve the conditions
      described by the manual.
variants:
  amd64:
    setup: category-network/DNS_Remote/Labsetup
    architecture: amd64
  arm64:
    setup: category-network/DNS_Remote/Labsetup-arm
    architecture: arm64
runtime:
  backend: compose
  compose: docker-compose.yml
  services:
    local-server:
      role: daemon
    user:
      role: daemon
    attacker:
      role: daemon
    attacker_ns:
      role: daemon
  readiness:
  - id: local-server-running
    type: service-state
    requirement: services
    service: local-server
    expected: running
    retries: 20
    interval: 2
  - id: user-running
    type: service-state
    requirement: services
    service: user
    expected: running
    retries: 20
    interval: 2
  - id: attacker-running
    type: service-state
    requirement: services
    service: attacker
    expected: running
    retries: 20
    interval: 2
  - id: attacker_ns-running
    type: service-state
    requirement: services
    service: attacker_ns
    expected: running
    retries: 20
    interval: 2
checks:
- id: local-server-ip-0
  type: container-ip
  requirement: topology
  service: local-server
  expected: 10.9.0.53
- id: user-ip-0
  type: container-ip
  requirement: topology
  service: user
  expected: 10.9.0.5
- id: attacker_ns-ip-0
  type: container-ip
  requirement: topology
  service: attacker_ns
  expected: 10.9.0.153
- id: attacker-host-network
  type: container-network-mode
  requirement: capabilities
  service: attacker
  expected: host
- id: local-server-bind-config
  type: exec
  requirement: configuration
  service: local-server
  argv:
  - named-checkconf
- id: local-server-named-running
  type: exec
  requirement: services
  service: local-server
  argv:
  - pgrep
  - named
- id: attacker_ns-bind-config
  type: exec
  requirement: configuration
  service: attacker_ns
  argv:
  - named-checkconf
- id: attacker_ns-named-running
  type: exec
  requirement: services
  service: attacker_ns
  argv:
  - pgrep
  - named
- id: dnssec-initially-disabled
  type: exec
  requirement: configuration
  service: local-server
  argv:
  - sh
  - -c
  - named-checkconf -p | grep -E "dnssec-validation[[:space:]]+no;"
- id: controlled-forward-zone
  type: exec
  requirement: services
  service: user
  argv:
  - dig
  - '@10.9.0.53'
  - ns.attacker32.com
  - A
  - +short
  - +time=2
  - +tries=1
  stdout_equals: 10.9.0.153
  retries: 15
  interval: 2
- id: attacker-authority-zone
  type: exec
  requirement: services
  service: user
  argv:
  - dig
  - '@10.9.0.153'
  - www.attacker32.com
  - A
  - +short
  - +time=2
  - +tries=1
  stdout_equals: 10.9.0.180
  retries: 15
  interval: 2
- id: query-source-port
  type: exec
  requirement: configuration
  service: local-server
  argv:
  - sh
  - -c
  - named-checkconf -p | grep -E "query-source.*33333"
