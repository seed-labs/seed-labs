id: network.sniffing_spoofing
category: network
description: Initial environment acceptance for Sniffing_Spoofing; no attacks or student
  solutions.
requirements:
  topology:
    source: category-network/Sniffing_Spoofing/Sniffing_Spoofing.tex
    section: Lab environment / initial topology
    description: Initial hosts, addresses, interfaces and routes match the supplied
      lab topology.
  services:
    source: category-network/Sniffing_Spoofing/Sniffing_Spoofing.tex
    section: Lab environment / initial services
    description: Provided services start and accept ordinary traffic before students
      modify the environment.
  capabilities:
    source: category-network/Sniffing_Spoofing/Sniffing_Spoofing.tex
    section: Lab environment / required tools
    description: Packet capture, protocol libraries and required kernel interfaces
      are usable.
variants:
  amd64:
    setup: category-network/Sniffing_Spoofing/Labsetup
    architecture: amd64
  arm64:
    setup: category-network/Sniffing_Spoofing/Labsetup-arm
    architecture: arm64
runtime:
  backend: compose
  compose: docker-compose.yml
  services:
    attacker:
      role: daemon
    hostA:
      role: daemon
    hostB:
      role: daemon
  readiness:
  - id: attacker-running
    type: service-state
    requirement: services
    service: attacker
    expected: running
    retries: 20
    interval: 2
  - id: hosta-running
    type: service-state
    requirement: services
    service: hostA
    expected: running
    retries: 20
    interval: 2
  - id: hostb-running
    type: service-state
    requirement: services
    service: hostB
    expected: running
    retries: 20
    interval: 2
checks:
- id: hosta-ip-0
  type: container-ip
  requirement: topology
  service: hostA
  expected: 10.9.0.5
- id: hostb-ip-0
  type: container-ip
  requirement: topology
  service: hostB
  expected: 10.9.0.6
- id: attacker-host-network
  type: container-network-mode
  requirement: capabilities
  service: attacker
  expected: host
- id: hosta-reaches-hostb
  type: exec
  requirement: topology
  service: hostA
  argv:
  - ping
  - -c
  - '2'
  - -W
  - '2'
  - 10.9.0.6
- id: attacker-capture-normal-icmp
  type: exec
  requirement: capabilities
  service: attacker
  argv:
  - python3
  - -c
  - from scapy.all import AsyncSniffer,conf; import subprocess,time; s=AsyncSniffer(iface=conf.route.route('10.9.0.5')[0],filter='icmp',count=1,store=True);
    s.start(); time.sleep(.5); subprocess.run(['ping','-c','1','-W','2','10.9.0.5'],check=True,timeout=4);
    s.join(4); assert s.results and len(s.results)>0
  timeout: 15
- id: libpcap-linked-program
  type: host-exec
  requirement: capabilities
  argv:
  - ./.seedtest/pcap-check
  stdout_contains: libpcap version
prepare:
- id: compile-pcap-capability
  argv:
  - gcc
  - .seedtest/pcap_check.c
  - -lpcap
  - -o
  - .seedtest/pcap-check
  expected:
  - .seedtest/pcap-check
tools:
- source: lab-setup/testing/tools/pcap_check.c
  destination: .seedtest/pcap_check.c
host:
  commands:
  - gcc
  packages:
  - gcc
  - libc6-dev
  - libpcap-dev
