id: network.morris_worm_nano
category: network
description: Complete Morris_Worm nano-internet.py environment acceptance; no student
  tasks or attacks are run.
requirements:
  generation:
    source: category-network/Morris_Worm/Morris_Worm.tex
    section: Lab Setup and the SEED Internet Emulator
    description: The unmodified provided generators produce the complete initial topology
      with the declared Emulator revision.
  topology:
    source: category-network/Morris_Worm/Morris_Worm.tex
    section: Lab Setup / initial topology
    description: All initial nodes run and have their specified Linux interface addresses,
      including self-managed/anycast addresses.
  services:
    source: category-network/Morris_Worm/Morris_Worm.tex
    section: Lab Setup / initial services
    description: Initial routing, name services, web services and target programs
      work without carrying out student attacks.
variants:
  amd64:
    setup: category-network/Morris_Worm/Labsetup
    architecture: amd64
  arm64:
    setup: category-network/Morris_Worm/Labsetup-arm
    architecture: arm64
emulator:
  revision: e03a1ac9f579d26dd09cff6ea1b282459ee11d86
prepare:
- id: generate-containers
  cwd: emulator-code
  argv:
  - python3
  - nano-internet.py
  expected:
  - emulator-code/output2/docker-compose.yml
  timeout: 900
build:
  timeout: 1800
  batch_size: 4
runtime:
  backend: compose
  start_timeout: 600
  stop_timeout: 300
  compose: emulator-code/output2/docker-compose.yml
  allowed_host_binds:
  - /var/run/docker.sock
  services:
    morris-worm-base:
      role: build-only
    072d7840db6a44d06e5c5fd4d7ea8a7d:
      role: build-only
    ee6b6326cce7e5be4913cbfc86f3c820:
      role: build-only
    hnode_151_host_0:
      role: daemon
    hnode_151_host_1:
      role: daemon
    hnode_151_host_2:
      role: daemon
    hnode_151_host_3:
      role: daemon
    hnode_151_host_4:
      role: daemon
    brdnode_151_router0:
      role: daemon
    hnode_152_host_0:
      role: daemon
    hnode_152_host_1:
      role: daemon
    hnode_152_host_2:
      role: daemon
    hnode_152_host_3:
      role: daemon
    hnode_152_host_4:
      role: daemon
    brdnode_152_router0:
      role: daemon
    hnode_153_host_0:
      role: daemon
    hnode_153_host_1:
      role: daemon
    hnode_153_host_2:
      role: daemon
    hnode_153_host_3:
      role: daemon
    hnode_153_host_4:
      role: daemon
    brdnode_153_router0:
      role: daemon
    rs_ix_ix100:
      role: daemon
    seedemu_internet_map:
      role: daemon
  readiness:
  - id: all-provided-nodes-running
    type: service-group
    requirement: topology
    services:
    - hnode_151_host_0
    - hnode_151_host_1
    - hnode_151_host_2
    - hnode_151_host_3
    - hnode_151_host_4
    - brdnode_151_router0
    - hnode_152_host_0
    - hnode_152_host_1
    - hnode_152_host_2
    - hnode_152_host_3
    - hnode_152_host_4
    - brdnode_152_router0
    - hnode_153_host_0
    - hnode_153_host_1
    - hnode_153_host_2
    - hnode_153_host_3
    - hnode_153_host_4
    - brdnode_153_router0
    - rs_ix_ix100
    - seedemu_internet_map
    expected: running
    retries: 30
    interval: 3
    timeout: 60
checks:
- id: all-linux-interface-addresses
  type: interface-addresses
  requirement: topology
  addresses:
    hnode_151_host_0:
    - 10.151.0.71
    hnode_151_host_1:
