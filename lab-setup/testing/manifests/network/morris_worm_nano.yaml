- id: map-exposes-complete-topology
  type: exec
  requirement: services
  service: seedemu_internet_map
  argv:
  - node
  - -e
  - 'const http=require("http");const expected=["hnode_151_host_0","hnode_151_host_1","hnode_151_host_2","hnode_151_host_3","hnode_151_host_4","brdnode_151_router0","hnode_152_host_0","hnode_152_host_1","hnode_152_host_2","hnode_152_host_3","hnode_152_host_4","brdnode_152_router0","hnode_153_host_0","hnode_153_host_1","hnode_153_host_2","hnode_153_host_3","hnode_153_host_4","brdnode_153_router0","rs_ix_ix100"];const
    req=http.get("http://127.0.0.1:8080/api/v1/container",r=>{let body="";r.on("data",x=>body+=x);r.on("end",()=>{try{const
    d=JSON.parse(body);if(!d.ok||!Array.isArray(d.result))throw Error(body);const
    services=new Set(d.result.map(x=>(x.Labels||{})["com.docker.compose.service"]));const
    missing=expected.filter(x=>!services.has(x));if(missing.length)throw Error("Map
    missing nodes: "+missing.join(","));console.log("Map exposes all expected nodes");}catch(e){console.error(String(e));process.exitCode=1;}});});req.on("error",e=>{console.error(String(e));process.exitCode=1;});req.setTimeout(10000,()=>req.destroy(Error("map
    API timeout")));'
  stdout_equals: Map exposes all expected nodes
  timeout: 15
  retries: 20
  interval: 2
