- id: map-exposes-complete-topology
  type: exec
  requirement: services
  service: seedemu_internet_map
  argv:
  - node
  - -e
  - 'const http=require("http");const expected=["brdnode_2_r100","brdnode_2_r101","brdnode_2_r102","brdnode_2_r105","brdnode_3_r100","brdnode_3_r103","brdnode_3_r104","brdnode_3_r105","brdnode_4_r100","brdnode_4_r102","brdnode_4_r104","brdnode_11_r102","brdnode_11_r105","brdnode_12_r101","brdnode_12_r104","hnode_150_webservice_0","hnode_150_host_1","brdnode_150_router0","hnode_151_webservice_0","hnode_151_host_1","brdnode_151_router0","hnode_152_host_0","hnode_152_host_1","brdnode_152_router0","hnode_153_webservice_0","hnode_153_host_1","hnode_153_host_2","hnode_153_local-dns-1","brdnode_153_router0","hnode_154_host_0","hnode_154_webservice_1","brdnode_154_router0","hnode_155_host_0","hnode_155_webservice_1","brdnode_155_router0","hnode_156_host_0","hnode_156_webservice_1","brdnode_156_router0","hnode_160_webservice_0","hnode_160_host_1","brdnode_160_router0","hnode_161_webservice_0","hnode_161_host_1","brdnode_161_router0","hnode_162_webservice_0","hnode_162_host_1","brdnode_162_router0","hnode_163_webservice_0","hnode_163_host_1","hnode_163_local-dns-2","brdnode_163_router0","hnode_164_host_0","hnode_164_host_1","brdnode_164_router0","hnode_170_webservice_0","hnode_170_host_1","brdnode_170_router0","hnode_171_host_0","brdnode_171_router0","hnode_190_host-0","hnode_190_host-1","brdnode_190_router0","brdnode_190_router1","rs_ix_ix100","rs_ix_ix101","rs_ix_ix102","rs_ix_ix103","rs_ix_ix104","rs_ix_ix105","hnode_162_eydtzirwzt","hnode_162_jdxcvkprdl"];const
    req=http.get("http://127.0.0.1:8080/api/v1/container",r=>{let body="";r.on("data",x=>body+=x);r.on("end",()=>{try{const
    d=JSON.parse(body);if(!d.ok||!Array.isArray(d.result))throw Error(body);const
    services=new Set(d.result.map(x=>(x.Labels||{})["com.docker.compose.service"]));const
    missing=expected.filter(x=>!services.has(x));if(missing.length)throw Error("Map
    missing nodes: "+missing.join(","));console.log("Map exposes all expected nodes");}catch(e){console.error(String(e));process.exitCode=1;}});});req.on("error",e=>{console.error(String(e));process.exitCode=1;});req.setTimeout(10000,()=>req.destroy(Error("map
    API timeout")));'
  stdout_equals: Map exposes all expected nodes
  timeout: 15
  retries: 20
  interval: 2
