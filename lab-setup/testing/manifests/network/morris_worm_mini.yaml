id: network.morris_worm_mini
category: network
description: Complete Morris_Worm mini-internet.py environment acceptance; no student
  tasks or attacks are run.
requirements:
  generation:
    source: category-network/Morris_Worm/Morris_Worm.tex
    section: Lab Setup and the SEED Internet Emulator
    description: The unmodified provided generators produce the complete initial topology
      with the declared Emulator revision.
  topology:
    source: category-network/Morris_Worm/Morris_Worm.tex
    section: Lab Setup / initial topology
    description: All initial nodes run and have their specified Linux interface addresses,
      including self-managed/anycast addresses.
  services:
    source: category-network/Morris_Worm/Morris_Worm.tex
    section: Lab Setup / initial services
    description: Initial routing, name services, web services and target programs
      work without carrying out student attacks.
variants:
  amd64:
    setup: category-network/Morris_Worm/Labsetup
    architecture: amd64
  arm64:
    setup: category-network/Morris_Worm/Labsetup-arm
    architecture: arm64
emulator:
  revision: e03a1ac9f579d26dd09cff6ea1b282459ee11d86
prepare:
- id: generate-containers
  cwd: emulator-code
  argv:
  - python3
  - mini-internet.py
  expected:
  - emulator-code/output/docker-compose.yml
  timeout: 900
build:
  timeout: 1800
  batch_size: 4
runtime:
  backend: compose
  start_timeout: 600
  stop_timeout: 300
  compose: emulator-code/output/docker-compose.yml
  allowed_host_binds:
  - /var/run/docker.sock
