name: Labsetup environment acceptance

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: labsetup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: lab-setup/testing/requirements*.txt
      - name: Install framework dependencies
        run: python -m pip install -r lab-setup/testing/requirements-dev.txt
      - name: Test framework behavior and manifest inputs
        run: python -m pytest -q lab-setup/testing/tests
      - name: Generate matrix from validated manifests
        id: plan
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          matrix = subprocess.check_output([sys.executable, 'lab-setup/testing/run.py', 'matrix'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + matrix + '\n')
          PY

  environment:
    needs: framework
    name: Environment (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.framework.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: lab-setup/testing/requirements.txt
      - run: python -m pip install -r lab-setup/testing/requirements.txt
      - name: Run the same lifecycle as local testing
        env:
          MANIFEST: ${{ matrix.manifest }}
          VARIANT: ${{ matrix.variant }}
        run: >-
          python lab-setup/testing/run.py all "$MANIFEST"
          --variant "$VARIANT" --run-dir ci-artifacts
      - name: Retry cleanup if interrupted
        if: always()
        env:
          MANIFEST: ${{ matrix.manifest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if test -f ci-artifacts/state.json; then
            python lab-setup/testing/run.py down "$MANIFEST" --variant "$VARIANT" --run-dir ci-artifacts
          fi
      - name: Add job summary
        if: always()
        run: |
          if test -f ci-artifacts/summary.md; then
            cat ci-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: labsetup-${{ strategy.job-index }}-${{ matrix.variant }}
          path: ci-artifacts/
          retention-days: 7
