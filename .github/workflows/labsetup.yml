name: Labsetup environment acceptance

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: labsetup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: lab-setup/testing/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r lab-setup/testing/requirements.txt
      - name: Generate matrix from validated manifests
        id: plan
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          matrix = subprocess.check_output([sys.executable, 'lab-setup/testing/run.py', 'matrix'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + matrix + '\n')
          PY

  environment:
    needs: plan
    name: ${{ matrix.lab }} (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        if: matrix.emulator
        with:
          repository: seed-labs/seed-emulator
          ref: ${{ matrix.emulator_revision }}
          path: .seed-emulator
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: lab-setup/testing/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r lab-setup/testing/requirements.txt
      - name: Prepare host prerequisites
        env:
          HOST_PACKAGES: ${{ toJSON(matrix.host_packages) }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          packages = json.loads(os.environ['HOST_PACKAGES'])
          if any(not re.fullmatch(r'[a-z0-9][a-z0-9+.-]*', item) for item in packages):
              raise SystemExit('Invalid host package name')
          if packages:
              subprocess.run(['sudo', '-n', 'apt-get', 'update'], check=True)
              subprocess.run(['sudo', '-n', 'apt-get', 'install', '-y', '--no-install-recommends', *packages], check=True)
          PYTHON
      - name: Run the same lifecycle as local testing
        env:
          MANIFEST: ${{ matrix.manifest }}
          VARIANT: ${{ matrix.variant }}
          SEED_EMULATOR_SOURCE: ${{ github.workspace }}/.seed-emulator
        run: >-
          python lab-setup/testing/run.py all "$MANIFEST"
          --variant "$VARIANT" --run-dir ci-artifacts
      - name: Retry cleanup if interrupted
        if: always()
        env:
          MANIFEST: ${{ matrix.manifest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if test -f ci-artifacts/state.json; then
            python lab-setup/testing/run.py down "$MANIFEST" --variant "$VARIANT" --run-dir ci-artifacts
          fi
      - name: Add job summary
        if: always()
        run: |
          if test -f ci-artifacts/summary.md; then
            cat ci-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: labsetup-${{ strategy.job-index }}-${{ matrix.variant }}
          path: |
            ci-artifacts/*.json
            ci-artifacts/*.yaml
            ci-artifacts/*.xml
            ci-artifacts/*.md
            ci-artifacts/*.txt
            ci-artifacts/logs/
          retention-days: 7
